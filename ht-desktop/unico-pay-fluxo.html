const overlay = app.querySelector('.overlay');
const shopEl = app.querySelector('[data-shop]');
const card = app.querySelector('.card');
const body = app.querySelector('.card__body');
const resizer = createCardResizer(card, overlay);

let currentScreenId = null;
let swapTimer = null;

// Histórico de navegação: o botão voltar sempre retorna à tela ANTERIOR,
// em qualquer caso de uso (antes ele era ancorado na Home do Onboarding).
// Telas marcadas com `transient: true` (loadings e câmera da SDK) não entram
// no histórico — voltar para elas reiniciaria a captura no meio do caminho.
const historico = [];
const HISTORICO_MAX = 30;
let voltandoNoHistorico = false;

const backBtn = app.querySelector('.card__header-back');
const helpBtn = app.querySelector('.btn--icon-help');

// Direção da seta de voltar e do botão de Ajuda é sempre a mesma: entram
// pela esquerda, saem pela direita. Isso só acontece ao SAIR de uma tela
// interna de volta para a Home — a entrada na tela interna já segue essa
// direção "de graça" com a transição comum (ver components.css).
function playOnce(el, animClass, totalMs) {
  el.classList.remove(animClass);
  void el.offsetWidth; // reinicia a animação mesmo se a classe já tiver rodado antes
  el.classList.add(animClass);
  // Remove ao terminar: a classe "segura" o estado final (fill-mode both),
  // o que atropelaria a transição normal na próxima troca se ficasse presa.
  // Em devices antigos o animationend às vezes NÃO dispara (frame perdido no
  // meio da troca de tela) e a seta ficava congelada em cima do logo — o
  // timeout é a rede de segurança que solta a classe de qualquer jeito.
  const clear = () => el.classList.remove(animClass);
  el.addEventListener('animationend', clear, { once: true });
  setTimeout(clear, totalMs + 80);
}

function navigate(screenId) {
  const screen = SCREENS[screenId];
  if (!screen) {
    console.warn(`Tela desconhecida: ${screenId}`);
    return;
  }
  const veioDaLoja = Boolean(SCREENS[currentScreenId]?.shop);
  document.body.classList.toggle('uc-shop-view', Boolean(screen.shop));
  if (screen.shop) {
    currentScreenId = screenId;
    historico.length = 0;
    closeMoreDrawer();
    shopEl.innerHTML = screen.render();
    screen.onMount?.(shopEl, { navigate, resizer });
    return;
  }
  // Empilha a tela que está saindo. Não empilha quando: é o próprio botão
  // voltar agindo, é um re-render da mesma tela (troca de idioma) ou a tela
  // que sai é transitória.
  const saindoDe = currentScreenId;
  if (!voltandoNoHistorico && saindoDe && saindoDe !== screenId && !SCREENS[saindoDe]?.transient) {
    historico.push(saindoDe);
    if (historico.length > HISTORICO_MAX) historico.shift();
  }

  currentScreenId = screenId;
  card.classList.remove('card--expanded');

  const wasInternal = card.classList.contains('card--internal');
  const willBeInternal = screen.header === 'internal';
  if (wasInternal && !willBeInternal) {
    // Voltando pra Home: a seta sai deslizando pra direita (não pelo mesmo
    // caminho por onde entrou) e o "?" entra deslizando pela esquerda.
    playOnce(backBtn, 'header-btn-exit-right', 120);
    playOnce(helpBtn, 'header-btn-enter-left', 160 + 240); // delay + duração
  }

  // Header troca de modo com transição própria; o card anima a altura (FLIP)
  // enquanto o conteúdo novo entra com fade — nada é remontado além do body.
  card.classList.toggle('card--internal', willBeInternal);

  // "Tela inicial" (frame homônimo): sem "?" — é a primeira tela do fluxo,
  // antes de qualquer outra existir para pedir ajuda sobre.
  card.classList.toggle('card--no-help', Boolean(screen.hideHelp));
  card.classList.toggle('card--success', Boolean(screen.success));

  // O botão de "mais" (drawer com Casos de uso/Tipo de experiência/
  // Personalização) fica visível em TODAS as telas, de todos os casos de
  // uso — o usuário pode trocar de caso/experiência/personalização a
  // qualquer momento do fluxo, não só na tela inicial. Trocar de tela
  // sempre fecha o drawer, se estiver aberto.
  closeMoreDrawer();
  // No modo "Redirect" (sem card), o card sempre reserva espaço no topo
  // pro botão de "mais" — ele agora existe em toda tela, então a reserva
  // (e a linha divisória, ver `card--reserve-top` no CSS) também.
  card.classList.add('card--reserve-top');

  // Logo do lojista: cada caso de uso tem o seu (Bradesco no Onboarding,
  // C&A no IDPay). A tela declara `headerLogo`; sem isso, mantém o atual.
  if (screen.headerLogo) {
    const logoImg = app.querySelector('.card__header-logo img');
    logoImg.src = screen.headerLogo;
    logoImg.alt = screen.headerLogoAlt ?? '';
  }

  // Faixa de aviso no topo do card (acima do header) — ex.: cartão recusado
  // no IDPay (frame "You - Creditcard verification 1" pós-captura).
  const banner = app.querySelector('[data-banner]');
  banner.hidden = !screen.banner;
  banner.innerHTML = screen.banner
    ? `<span class="card__banner-icon">${icon('alert-triangle', '')}</span>` +
      `<p class="card__banner-text">${screen.banner()}</p>`
    : '';

  // Título opcional centralizado no header (ex.: tela Documento)
  const headerTitle = app.querySelector('.card__header-title');
  headerTitle.style.cssText = ''; // limpa largura/animação inline de telas anteriores
  // A saída do pill usa element.animate com fill:forwards — sem cancelar,
  // o opacity:0 fica pendurado no elemento (que é reaproveitado) e o pill
  // da tela seguinte nasce invisível.
  headerTitle.getAnimations?.().forEach((anim) => anim.cancel());
  if (screen.headerTag) {
    // Tag/pill preta (frames "SDK Loading 1/3"): spinner branco girando à
    // esquerda + texto. As telas trocam o lead em runtime (bolinha amarela,
    // check) via swapTagContent.
    headerTitle.innerHTML =
      `<span class="header-tag__lead header-tag__lead--spin">${icon('loader-sm', '')}</span>` +
      `<span class="header-tag__text">${t(screen.headerTitle)}</span>`;
  } else {
    headerTitle.textContent = screen.headerTitle ? t(screen.headerTitle) : '';
  }
  card.classList.toggle('card--header-title', Boolean(screen.headerTitle));

  // Título em formato de tag/pill (frame "SDK Loading 1"), com fade + slide
  // de cima para baixo em vez do fade simples do título comum.
  card.classList.toggle('card--header-tag', Boolean(screen.headerTag));

  // Transição sem tranco, em 2 tempos:
  // 1. Mede o tamanho FINAL da próxima tela (render invisível) e anima a
  //    altura do card direto para ele — o card chega pronto no destino.
  // 2. O conteúdo entra com um fade simples (só opacity, sem movimento).
  body.classList.remove('screen-enter');
  const html = screen.render();
  resizer.resizeTo(() => {
    body.innerHTML = html; // mede com o conteúdo real…
  }, () => {
    body.innerHTML = ''; // corpo fica vazio enquanto a altura anima
  });

  // O conteúdo só entra quando a altura terminou de animar: o fade acontece
  // com tudo parado — garantia de que nada se move na tela durante ele.
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => {
    body.innerHTML = html;
    void body.offsetWidth; // garante que o fade reinicia do zero
    body.classList.add('screen-enter');
    screen.onMount?.(body, { navigate, resizer });
  }, TOKENS.transitionScreenMs);

  // Vindo do checkout da loja: o card sobe de baixo pra cima.
  if (veioDaLoja) {
    const alturaFinal = parseFloat(card.style.height) || card.offsetHeight;
    card.style.transition = 'none';
    card.style.height = '0px';
    void card.offsetHeight;
    card.style.transition = '';
    card.style.height = `${alturaFinal}px`;
  }
}

// Comportamento dos textfields no mobile (expandir → focar → recolher),
// por delegação: cobre os campos atuais e os das próximas telas.
setupMobileKeyboard({ body, resizer });

// ===== Bottom sheet de seleção de idioma (frame "Seleção do Idioma 1") =====
// Abre pelo link de idioma do rodapé; fecha pelo X ou selecionando um idioma.
// Os dois ingleses usam a tradução americana; espanhol não tem tradução
// neste protótipo e permanece em português.
const LANGUAGES = [
  { flag: '🇧🇷', name: 'Português (BR)', code: 'pt' },
  { flag: '🇺🇸', name: 'Inglês (US)', code: 'en' },
  { flag: '🇬🇧', name: 'Inglês (UK)', code: 'en' },
  { flag: '🇪🇸', name: 'Espanhol (ES)', code: 'es' },
];
let currentLanguage = 0;

const langOptionsEl = app.querySelector('[data-lang-options]');
const langLabelEl = app.querySelector('[data-lang-label]');

// Textos do shell (montados uma vez no innerHTML): reaplicados na troca de
// idioma — footer, título do sheet, label do idioma e as 3 linhas do

function applyShellTexts() {
  app.querySelector('.card__footer-link').innerHTML = `${icon('lock', '')}${t('Privacidade')}`;
  app.querySelector('.lang-sheet__title').textContent = t('Selecione o idioma');
  langLabelEl.textContent = t(LANGUAGES[currentLanguage].name);
  app.querySelector('.proto-drawer__title').textContent = t('Configurações do protótipo');
  app.querySelector('.usecase-select__label').textContent = t('Casos de uso');
  app.querySelector('.experience-select__label').textContent = t('Tipo de experiência');
  app.querySelector('.personalization-toggle__label').textContent = t('Personalização');
  app.querySelector('.personalization-toggle__value').textContent = personalizationOn ? 'On' : 'Off';
  applyUseCaseText();
  applyExperienceText();

// Drawer "Mais opções" (botão de 3 pontinhos, canto superior direito): abre
// de baixo pra cima por CIMA de toda a experiência (funciona igual nos
// modos Iframe e Redirect, já que fica fora do card). Reúne as 3 linhas de
// configuração do protótipo — Casos de uso, Tipo de experiência,
// Personalização — que antes ficavam soltas como textos fixos no topo.
const moreToggle = app.querySelector('.more-toggle');
const protoDrawer = app.querySelector('[data-proto-drawer]');
function openMoreDrawer() {
  protoDrawer.classList.add('proto-drawer--open');
}
function closeMoreDrawer() {

moreToggle.addEventListener('click', openMoreDrawer);
app.querySelectorAll('[data-action="close-more"]').forEach((el) => el.addEventListener('click', closeMoreDrawer));

// Linha "Casos de uso": o texto visível é um label; o clique abre o
// <select> NATIVO do browser (transparente por cima, cobrindo a linha
// inteira), e a escolha troca o valor mostrado. Os nomes dos casos são
// nomes de produto — não são traduzidos; só o label "Casos de uso" passa
// pelo t() (em `applyShellTexts`).
const useCaseControl = app.querySelector('.usecase-select__control');
function applyUseCaseText() {
  app.querySelector('.usecase-select__text').textContent = useCaseControl.value;
}

// Linha "Tipo de experiência" (mesmo padrão da linha acima): "Iframe" é a
// experiência de hoje (o card flutuante); "Redirect" são as MESMAS telas
// sem o card — preenchendo a página inteira, cantos retos, sem sombra,
// simulando um redirecionamento de verdade (frames "redirect 0-6", página
// "Revisão v2"). Vale para todos os casos de uso: é só o container que
// muda, o conteúdo das telas é idêntico.
const experienceControl = app.querySelector('.experience-select__control');
function applyExperienceText() {
  app.querySelector('.experience-select__text').textContent = experienceControl.value;
}
experienceControl.addEventListener('change', () => {
  applyExperienceText();
  document.body.classList.toggle('experience-redirect', experienceControl.value === 'Redirect');
  // Diferente do caso de uso, trocar a experiência NÃO recarrega a tela —
  // é só o container (card vs. página cheia) mudando por baixo. O drawer
  // fica aberto de propósito, pra comparar Iframe/Redirect rapidinho.
});
// Loading de abertura (frame "Dynamic 0"): página inteira com spinner, sem
// card — aparece em TODA abertura de caso de uso (boot e troca no seletor),
// segura um instante e sai revelando a tela inicial com o card SUBINDO de
// baixo pra cima (cresce da base zero), não já pronto.
const pageLoading = app.querySelector('[data-page-loading]');
const PAGE_LOADING_MS = 1400;
let pageLoadingTimer = null;

function abrirComLoading(screenId) {
  clearTimeout(pageLoadingTimer);
  pageLoading.hidden = false;
  pageLoading.classList.remove('page-loading--saindo');
  pageLoadingTimer = setTimeout(() => {
    pageLoading.classList.add('page-loading--saindo');
    setTimeout(() => { pageLoading.hidden = true; }, 320);

    // O overlay começa a sumir e, no mesmo instante, o card entra crescendo
    // de baixo pra cima. `navigate` monta a tela normalmente (header, footer,
    // fade do conteúdo) e mede a altura certa via resizer.resizeTo — depois
    // fazemos nosso próprio FLIP em cima disso: colapsa pra 0 SEM transição
    // (instantâneo, sem animação visível) e volta com a transição normal do
    // card (300ms) até a altura já medida. É o mesmo truque de reflow forçado
    // usado no resto de card-resize.js.
    navigate(screenId);
    // Lê `card.style.height` (string, ex.: "524px"), NÃO `card.offsetHeight`:
    // o resizeTo interno do navigate já deixou sua PRÓPRIA transição correndo
    // (da altura antiga até a nova); ler o LAYOUT nesse instante captura o
    // valor ainda em interpolação (a altura antiga), não o alvo. O valor que
    // resizeTo atribuiu ao estilo, por outro lado, já é o alvo exato.
    const alturaFinal = parseFloat(card.style.height) || card.offsetHeight;
    card.style.transition = 'none';
    card.style.height = '0px';
    void card.offsetHeight; // força reflow: comita o 0px sem animação
    card.style.transition = '';
    card.style.height = `${alturaFinal}px`; // dispara a subida (300ms, transição padrão do .card)
  }, PAGE_LOADING_MS);
}

useCaseControl.addEventListener('change', () => {
  applyUseCaseText();
  // Trocar o caso de uso reinicia o fluxo na tela inicial correspondente,
  // com o loading de abertura na frente, e reflete na URL para o link
  // poder ser compartilhado como está.
  const caso = USE_CASES.find((c) => c.label === useCaseControl.value);
  document.body.classList.toggle('uc-pay', ['unico-pay', 'widget', 'valida'].includes(caso?.slug));
  if (caso) try { history.replaceState(null, '', `/${caso.slug}`); } catch (e) {}
  abrirComLoading(caso?.entry ?? 'inicial');
});

function renderLanguageOptions() {
  langOptionsEl.innerHTML = LANGUAGES.map(
    (lang, i) => `
    <div class="lang-sheet__divider"></div>
    <button class="lang-sheet__option" data-lang-index="${i}">
      <span class="lang-sheet__flag">${lang.flag}</span>
      <span class="lang-sheet__name">${t(lang.name)}</span>
      ${i === currentLanguage ? `<span class="lang-sheet__check">${icon('check', 'Selecionado')}</span>` : ''}
    </button>
  `
  ).join('');

  langOptionsEl.querySelectorAll('.lang-sheet__option').forEach((option) => {
    option.addEventListener('click', () => {
      currentLanguage = Number(option.dataset.langIndex);
      setLanguage(LANGUAGES[currentLanguage].code);
      applyShellTexts();
      closeLanguageSheet();
      navigate(currentScreenId); // re-renderiza a tela atual no novo idioma
      if (document.body.classList.contains('uc-pay') && !SCREENS[currentScreenId]?.shop) shopEl.innerHTML = SCREENS.payLoja.render();
    });
  });
}

function openLanguageSheet() {
  renderLanguageOptions();
  card.classList.add('card--lang-open');
}

function closeLanguageSheet() {
  card.classList.remove('card--lang-open');
}

app.querySelector('.card__footer-lang').addEventListener('click', (e) => {

});
app.querySelector('[data-action="close-lang"]').addEventListener('click', closeLanguageSheet);

// A seta de voltar do header retorna à tela anterior do histórico. Nas
// telas da SDK isso cai naturalmente na tela inicial do caso de uso ativo
// (as transitórias não entram no histórico); se não houver histórico, a
// Home é o destino seguro.
app.querySelector('[data-action="back"]').addEventListener('click', () => {
  const destino = historico.pop() ?? 'home';
  voltandoNoHistorico = true;

  voltandoNoHistorico = false;
});
app.querySelector('[data-action="close"]').addEventListener('click', () => {
  if (document.body.classList.contains('uc-pay')) navigate('payLoja');
  else if (currentScreenId === 'humanSucesso') parent.postMessage({ sapDone: true }, '*');
  else console.log('Fechar clicado — comportamento a definir');

// Toggle de personalização (white-label), fora do card: com "Off", os

});

// Abertura: o caso de uso vem da URL (/idpay, /onboarding ...). Sem slug
// reconhecido, abre o Onboarding e normaliza a URL para o slug dele.
const slugInicial = 'human'; // demo SAP: abre direto em Human Token
const frameLabel = window.name.startsWith('uc-frame:') ? window.name.slice(9) : null;
const casoInicial = USE_CASES.find((c) => c.label === frameLabel) ?? useCasePorSlug(slugInicial) ?? USE_CASES.find((c) => c.slug === 'valida') ?? USE_CASES[0];
useCaseControl.value = casoInicial.label;
applyUseCaseText();
applyExperienceText(); // "Iframe" por padrão — mesma UX de sempre
try { history.replaceState(null, '', `/${casoInicial.slug}`); } catch (e) {}
document.body.classList.toggle('uc-pay', ['unico-pay', 'widget', 'valida'].includes(casoInicial.slug));

// ---- Device (Desktop | Mobile): "Mobile" encaixa a experiência num celular mock
// (iframe com viewport de 390px, então o layout mobile real é usado).
const IN_FRAME = window.name.startsWith('uc-frame');
const deviceControl = app.querySelector('.device-select__control');
const deviceText = app.querySelector('.device-select__text');
let dvStage = null;
function dvFit() {
  if (!dvStage) return;
  const phone = dvStage.firstElementChild; // .dv-wrap
  phone.style.zoom = Math.min(1, (window.innerHeight - 32) / 892, (window.innerWidth - 32) / 438);
}
function setDevice(mode) {
  deviceControl.value = mode;
  deviceText.textContent = mode;
  dvStage?.remove(); dvStage = null;
  document.body.classList.remove('dv-mock');
  document.body.classList.toggle('dv-desk', mode === 'Desktop' && window.innerWidth > 600);
  app.style.display = '';
  if (mode === 'Mobile' && window.innerWidth > 600) {
    closeMoreDrawer();
    const now = new Date();
    const clock = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
