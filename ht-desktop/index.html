<title>Desktop SAP Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: full-screen macOS desktop. Wallpaper layer, menu bar on top, dock floating at the bottom. */
  :root {
    --menubar-h: 28px;
    --ink: #ffffff;
    --ink-soft: rgba(255,255,255,.78);
    --glass: rgba(76,64,120,.42);
    --glass-edge: rgba(255,255,255,.26);
    --bar: rgba(20,22,40,.28);
    --icon: clamp(22px, 5.1vw, 70px);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #1b1a3a;
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ---------- Wallpaper (abstract ribbon, default-style) ---------- */
  .wallpaper { position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(55% 70% at 6% 8%, #5a52e6 0%, rgba(90,82,230,0) 62%),
      radial-gradient(45% 55% at 98% 6%, #ff8fc4 0%, rgba(255,143,196,0) 65%),
      radial-gradient(50% 60% at 82% 70%, #e8409f 0%, rgba(232,64,159,0) 70%),
      radial-gradient(70% 50% at 28% 100%, #2a1b86 0%, rgba(42,27,134,0) 70%),
      linear-gradient(140deg, #4132c9 0%, #6b2fbb 48%, #b8369f 100%);
  }
  .wallpaper svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Ícones na área de trabalho ---------- */
  .desktop { position: fixed; top: calc(var(--menubar-h) + 14px); right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 1; }
  .dicon { width: 92px; padding: 4px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 0; background: none; cursor: default; font: inherit; color: inherit; border-radius: 8px; }
  .dicon svg { width: 64px; height: 64px; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); }
  .dicon .lbl { max-width: 100%; padding: 1px 7px; border-radius: 5px; font-size: 12px; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .dicon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .dicon.sel svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)) brightness(.8); }
  .dicon.sel { background: rgba(255,255,255,.16); }
  .dicon.sel .lbl { background: #0a60ff; text-shadow: none; }
  @media (max-width: 720px) { .dicon svg { width: 52px; height: 52px; } .dicon { width: 76px; } .desktop { right: 8px; } }

  /* ---------- Menu bar ---------- */
  .menubar { position: fixed; inset: 0 0 auto 0; height: var(--menubar-h); display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; background: var(--bar); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    font-size: 13px; letter-spacing: .005em; z-index: 5; }
  .menubar .left, .menubar .right { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .menubar .apple { width: 14px; height: 17px; fill: var(--ink); display: block; }
  .menubar b { font-weight: 700; }
  .menubar .right svg { height: 14px; width: auto; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .menubar .right .fill { fill: var(--ink); stroke: none; }
  #clock { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Dock ---------- */
  .dock-wrap { position: fixed; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; z-index: 5; pointer-events: none; padding: 0 8px; }
  .dock { pointer-events: auto; display: flex; align-items: flex-end; gap: clamp(3px, 1.5vw, 20px);
    padding: 8px 14px; border-radius: 24px; max-width: 100%;
    background: var(--glass); border: 1px solid var(--glass-edge);
    backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: 0 12px 40px rgba(10,8,40,.38), inset 0 1px 0 rgba(255,255,255,.22); }
  .item { position: relative; width: var(--icon); height: var(--icon); flex: none; padding: 0; border: 0; background: none; cursor: pointer;
    transform-origin: 50% 100%; transition: transform .12s ease-out; font: inherit; color: inherit; }
  .item svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
  .item:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 14px; }
  .item .tip { position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%) translateY(4px); opacity: 0; pointer-events: none;
    padding: 4px 11px; border-radius: 7px; background: rgba(40,42,60,.82); border: 1px solid rgba(255,255,255,.18);
    font-size: 13px; white-space: nowrap; transition: opacity .12s, transform .12s; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .item:hover .tip, .item:focus-visible .tip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .item.run::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(255,255,255,.85); }
  .sep { width: 1px; height: calc(var(--icon) * .8); align-self: center; background: rgba(255,255,255,.3); margin: 0 3px; flex: none; }
  .item.bounce { animation: bounce .7s cubic-bezier(.3,.7,.4,1) 2; }
  @keyframes bounce { 0%,100% { translate: 0 0; } 40% { translate: 0 calc(var(--icon) * -.55); } }

  /* ---------- Janela do app (pop-up) ---------- */
  .win { --sap-blue: #0a6ed1; position: fixed; left: 0; right: 0; margin: 0 auto; z-index: 3;
    top: calc(var(--menubar-h) + 6vh); width: min(1180px, calc(100vw - 32px));
    height: min(680px, calc(100vh - var(--menubar-h) - 6vh - 110px));
    display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background: #fff; color: #fff;
    box-shadow: 0 28px 80px rgba(14,8,50,.55), 0 0 0 1px rgba(0,0,0,.28); }
  .win.opening { animation: winIn .32s cubic-bezier(.2,.8,.2,1) both; }
  .win.closing { animation: winOut .2s ease-in both; }
  @keyframes winIn  { from { opacity: 0; scale: .15; } to { opacity: 1; scale: 1; } }
  @keyframes winOut { from { opacity: 1; scale: 1; } to { opacity: 0; scale: .15; } }
  .win.max { left: 0 !important; top: var(--menubar-h) !important; width: 100% !important; height: calc(100% - var(--menubar-h)) !important; border-radius: 0; }
  .wbar { position: relative; flex: none; height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 14px;
    background: var(--sap-blue); font-family: "Space Grotesk", var(--font); touch-action: none; }
  .lights { display: flex; gap: 8px; }
  .l { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; }
  .l.close { background: #ff5f57; } .l.min { background: #febc2e; } .l.max { background: #28c840; }
  .l:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .wlogo { height: 20px; width: auto; display: block; }
  .wnav { display: flex; align-items: center; gap: 18px; }
  .wnav svg, .wmenu { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .wmenu { margin-left: auto; width: 20px; opacity: .75; }
  .wtitle { position: absolute; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 500; letter-spacing: .01em;
    padding: 0 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .wbody { flex: 1; min-height: 0; background: #fafafa; overflow: hidden; container-type: inline-size; }
  .wbody.is-home { overflow: auto; background: #f5f6f7; }

  /* ---------- Home do SAP Account Manager (depois do sucesso) ---------- */
  .sh { --ink: #1d2d3e; --mute: #556b82; --blue: #0064d9; --line: #d5dadd; min-height: 100%; display: flex; flex-direction: column;
    background: #f5f6f7; color: var(--ink); font: 14px/1.4 "Inter", "Helvetica Neue", Arial, sans-serif; text-align: left; user-select: text; }
  .sh.sh--in { animation: shIn .35s ease-out both; }
  @keyframes shIn { from { opacity: 0; } to { opacity: 1; } }
  .sh button { font: inherit; color: inherit; cursor: pointer; }
  .sh-wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  .sh-top { background: #f4f5f6; }
  .sh-top__in { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .sh-brand { display: flex; align-items: center; gap: 16px; font-size: 16px; font-weight: 700; }
  .sh-logo { height: 32px; width: auto; display: block; }
  .sh-tools { display: flex; align-items: center; gap: 24px; }
  .sh-tools svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .sh-explore { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .sh-explore svg { width: 12px; height: 12px; }
  .sh-av { display: grid; place-items: center; border-radius: 50%; background: #d1efff; color: #0070f2; font-weight: 400; position: relative; flex: none; }
  .sh-av--sm { width: 32px; height: 32px; font-size: 12px; }
  .sh-av--lg { width: 120px; height: 120px; font-size: 48px; }
  .sh-badge { position: absolute; right: 2px; bottom: 2px; width: 28px; height: 28px; border-radius: 50%; background: #0064d9; display: grid; place-items: center; }
  .sh-badge svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sh-hero { background: #fff; border-bottom: 1px solid #89919a; }
  .sh-id { display: flex; align-items: flex-start; gap: 32px; padding: 32px 0 24px; }
  .sh-id__main { flex: 1; min-width: 0; }
  .sh-lbl { font-size: 13px; color: var(--ink); }
  .sh-id h1 { margin: 2px 0 8px; font-size: 28px; line-height: 1.2; font-weight: 700; }
  .sh-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 32px; margin: 0; padding-left: 4px; }
  .sh-facts dt { font-size: 11px; color: var(--ink); }
  .sh-facts dd { margin: 2px 0 0; font-size: 15px; overflow-wrap: anywhere; }
  .sh-btn { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #0064d9; background: #fff; color: #0064d9 !important; font-weight: 600; font-size: 14px; }
  .sh-btn--fill { background: #0064d9; color: #fff !important; }
  .sh-btn--sm { height: 36px; padding: 0 12px; }
  .sh-btn:hover { filter: brightness(.96); }
  .sh-tabs { display: flex; gap: 36px; }
  .sh-tabs button { border: 0; background: none; padding: 14px 4px 16px; font-size: 16px; font-weight: 700; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .sh-tabs .on { color: #0064d9; border-bottom-color: #0064d9; }
  .sh-main { flex: 1; padding: 32px 0 48px; }
  .sh-alert { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; margin-bottom: 24px; border: 1px solid #e9730c; border-radius: 8px; background: #fff3b8; font-size: 15px; }
  .sh-alert > svg { flex: none; width: 18px; height: 18px; margin-top: 3px; fill: #aa0808; }
  .sh-alert p { margin: 0; flex: 1; min-width: 0; }
  .sh-alert a { color: #0064d9; text-decoration: underline; margin-right: 6px; }
  .sh-pill { border: 1px solid #e9730c; background: #fff3b8; color: #aa2a00 !important; border-radius: 10px; padding: 1px 10px; font-size: 13px; font-weight: 600; }
  .sh-x { border: 0; background: none; padding: 2px; display: grid; }
  .sh-x svg { width: 16px; height: 16px; fill: none; stroke: #0064d9; stroke-width: 2; stroke-linecap: round; }
  .sh-cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .sh-card { background: #fff; border-radius: 12px; box-shadow: 0 0 2px rgba(34,53,72,.2), 0 2px 4px rgba(34,53,72,.2); overflow: hidden; }
  .sh-card__head { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
  .sh-card__head h2 { margin: 0; margin-right: auto; font-size: 18px; font-weight: 700; }
  .sh-card__head svg { width: 16px; height: 16px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; }
  .sh-row { display: grid; grid-template-columns: 2fr 1.4fr 24px; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .sh-row--th { font-weight: 700; min-height: 44px; background: #fff; }
  .sh-row--grp { background: #fafafa; font-weight: 600; grid-template-columns: 1fr; min-height: 36px; }
  .sh-row--sel { background: #e5f6ff; border-bottom: 0; min-height: 40px; }
  .sh-row svg { width: 12px; height: 12px; fill: none; stroke: #0064d9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; justify-self: end; }
  .sh-who { display: flex; align-items: center; gap: 16px; padding: 24px 24px 24px 24px; border-bottom: 1px solid var(--line); }
  .sh-who .sh-av { width: 64px; height: 64px; }
  .sh-who .sh-av svg { width: 28px; height: 28px; fill: none; stroke: #0064d9; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sh-who .sh-badge { width: 18px; height: 18px; right: 0; bottom: 0; } .sh-who .sh-badge svg { width: 9px; height: 9px; stroke: #fff; fill: none; }
  .sh-who__t { flex: 1; min-width: 0; }
  .sh-who__t b { display: block; font-size: 20px; line-height: 1.2; }
  .sh-who__t span { font-size: 15px; }
  .sh-dots { border: 0; background: none; align-self: flex-start; padding: 0; font-size: 20px; line-height: 1; letter-spacing: 1px; color: var(--blue); }
  .sh-info { padding: 24px; }
  .sh-info h3 { margin: 0 0 16px; font-size: 20px; }
  .sh-info dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin: 0; }
  .sh-info dt { font-size: 12px; } .sh-info dd { margin: 2px 0 0; font-size: 15px; }
  .sh-foot { background: #e8ebed; }
  .sh-foot__in { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-size: 14px; padding-top: 12px; padding-bottom: 12px; }
  .sh-foot nav { display: flex; gap: 48px; flex-wrap: wrap; }
  @container (max-width: 860px) {
    .sh-cols { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .sh-facts { grid-template-columns: minmax(0, 1fr); }
    .sh-av--lg { width: 80px; height: 80px; font-size: 32px; }
    .sh-id { gap: 16px; }
    .sh-foot nav { gap: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .sh.sh--in { animation: none; } }
  .wbody iframe { width: 100%; height: 100%; border: 0; display: block; background: #fafafa; }
  @media (max-width: 720px) { .wnav, .wlogo { display: none; } .wtitle { padding: 0 90px; font-size: 12px; } }
  @media (prefers-reduced-motion: reduce) { .win.opening, .win.closing { animation: none; } }

  @media (max-width: 560px) { .dock { gap: 3px; padding: 8px 10px; } }
  @media (max-width: 720px) {
    .menubar .left span:not(.keep), .menubar .right .opt { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item { transition: none; }
    .item.bounce { animation: none; }
  }
</style>

<script>
(function () {
  // Relógio e data do Calendário em português
  function tick() {
    var d = new Date();
    var wd = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
    var mo = d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    var hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('clock').textContent = wd + ' ' + d.getDate() + ' ' + mo + '  ' + hm;
    document.getElementById('calDow').textContent = mo.toUpperCase();
    var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
    var wdL = cap(d.toLocaleDateString('pt-BR', { weekday: 'short' }));
    var moL = cap(d.toLocaleDateString('pt-BR', { month: 'short' }));
    document.getElementById('wtitle').textContent = wdL + ' ' + d.getDate() + ' De ' + moL + ' - ' + hm + ' - SAP - v1.0.0';
    document.getElementById('calDay').textContent = d.getDate();
  }
  tick(); setInterval(tick, 15000);

  // Ampliação do Dock ao passar o mouse
  var dock = document.getElementById('dock');
  var items = Array.prototype.slice.call(dock.querySelectorAll('.item'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function magnify(e) {
    if (reduce) return;
    items.forEach(function (it) {
      var r = it.getBoundingClientRect();
      var dist = Math.abs(e.clientX - (r.left + r.width / 2));
      var s = 1 + 0.55 * Math.max(0, 1 - dist / (r.width * 2.6));
      it.style.transform = 'scale(' + s.toFixed(3) + ')';
    });
  }
  function reset() { items.forEach(function (it) { it.style.transform = ''; }); }
  dock.addEventListener('mousemove', magnify);
  dock.addEventListener('mouseleave', reset);

  // Clique: o ícone salta. O SAP é o ponto de partida da demo.
  items.forEach(function (it) {
    it.addEventListener('click', function () {
      it.classList.remove('bounce'); void it.offsetWidth; it.classList.add('bounce');
      if (it.id === 'app-sap') {
        window.dispatchEvent(new CustomEvent('demo:open-sap'));
      }
    });
    it.addEventListener('animationend', function () { it.classList.remove('bounce'); });
  });

  // Ícone da área de trabalho: clique seleciona, duplo clique abre (e faz o Dock saltar)
  var desk = document.getElementById('desk-sap');
  desk.addEventListener('click', function (e) { e.stopPropagation(); desk.classList.add('sel'); });
  desk.addEventListener('dblclick', function (e) { e.stopPropagation(); document.getElementById('app-sap').click(); });
  desk.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('app-sap').click(); });
  document.addEventListener('click', function () { desk.classList.remove('sel'); });

  // Janela do SAP: abre saindo do ícone do Dock
  var win = document.getElementById('win-sap');
  var wbar = document.getElementById('wbar');
  var dockSap = document.getElementById('app-sap');
  var appName = document.getElementById('appname');
  var openTimer;
  var sapBody = document.getElementById('sap-body');

  // A experiência (Human Token, Desktop) vive em unico-pay-fluxo.html, publicado junto desta página.
  // Ela é buscada uma vez e montada num iframe a cada abertura, então começa do zero sempre.
  var protoReq = null;
  function loadProto() {
    if (!protoReq) {
      protoReq = fetch('unico-pay-fluxo.html').then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      });
      protoReq.catch(function () { protoReq = null; });
    }
    return protoReq;
  }
  // Fim do fluxo: o modal some e a janela passa a mostrar a home do SAP Account Manager.
  function showHome() {
    var f = sapBody.querySelector('iframe');
    if (!f) return;
    f.style.transition = 'opacity .25s ease'; f.style.opacity = '0';
    setTimeout(function () {
      if (win.hidden) return;
      var d = new Date();
      var today = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      var frag = document.getElementById('tpl-sap-home').content.cloneNode(true);
      frag.querySelectorAll('[data-today]').forEach(function (el) { el.textContent = today; });
      frag.querySelector('[data-year]').textContent = d.getFullYear();
      frag.querySelectorAll('[data-dismiss]').forEach(function (b) {
        b.addEventListener('click', function () { var a = b.closest('[data-alert]'); if (a) a.remove(); });
      });
      frag.querySelectorAll('[data-noop]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
      sapBody.textContent = '';
      sapBody.classList.add('is-home');
      sapBody.appendChild(frag);
      sapBody.firstElementChild.classList.add('sh--in');
    }, 260);
  }
  window.addEventListener('message', function (e) {
    var f = sapBody.querySelector('iframe');
    if (f && e.source === f.contentWindow && e.data && e.data.sapDone) showHome();
  });

  function mountExperience() {
    sapBody.textContent = '';
    sapBody.classList.remove('is-home');
    var f = document.createElement('iframe');
    f.title = 'Experiência Human Token';
    f.setAttribute('allow', 'camera; microphone');
    sapBody.appendChild(f);
    loadProto().then(function (html) { f.srcdoc = html; }).catch(function () {
      sapBody.textContent = 'Não foi possível carregar a experiência.';
      sapBody.style.cssText = 'display:grid;place-items:center;color:#4f4f4f;font:14px var(--font)';
    });
  }
  function unmountExperience() { sapBody.textContent = ''; sapBody.classList.remove('is-home'); sapBody.removeAttribute('style'); }
  setTimeout(function () { loadProto().catch(function () {}); }, 800);

  function openSap() {
    if (!win.hidden) return;
    clearTimeout(openTimer);
    openTimer = setTimeout(function () {
      var r = dockSap.getBoundingClientRect();
      win.hidden = false;
      var w = win.getBoundingClientRect();
      win.style.transformOrigin = (r.left + r.width / 2 - w.left) + 'px ' + (r.top + r.height / 2 - w.top) + 'px';
      win.classList.remove('closing'); win.classList.add('opening');
      dockSap.classList.add('run');
      appName.textContent = 'SAP';
      mountExperience();
    }, 450);
  }
  function closeSap() {
    if (win.hidden || win.classList.contains('closing')) return;
    var r = dockSap.getBoundingClientRect();
    var w = win.getBoundingClientRect();
    win.style.transformOrigin = (r.left + r.width / 2 - w.left) + 'px ' + (r.top + r.height / 2 - w.top) + 'px';
    win.classList.remove('opening'); win.classList.add('closing');
    dockSap.classList.remove('run');
    appName.textContent = 'Finder';
    var done = function () { win.hidden = true; win.classList.remove('closing'); unmountExperience(); };
    if (reduce) done(); else win.addEventListener('animationend', done, { once: true });
  }
  window.addEventListener('demo:open-sap', openSap);
  document.getElementById('w-close').addEventListener('click', closeSap);
  document.getElementById('w-min').addEventListener('click', closeSap);
  document.getElementById('w-max').addEventListener('click', function () { win.classList.toggle('max'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSap(); });

  // Arrastar a janela pela barra de título
  var drag = null;
  wbar.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button') || win.classList.contains('max')) return;
    var r = win.getBoundingClientRect();
    win.style.left = r.left + 'px'; win.style.top = r.top + 'px'; win.style.right = 'auto'; win.style.margin = '0';
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    wbar.setPointerCapture(e.pointerId);
  });
  wbar.addEventListener('pointermove', function (e) {
    if (!drag) return;
    win.style.left = (e.clientX - drag.dx) + 'px';
    win.style.top = Math.max(28, e.clientY - drag.dy) + 'px';
  });
  wbar.addEventListener('pointerup', function () { drag = null; });
})();
</script>
